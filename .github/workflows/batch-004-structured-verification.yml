name: Batch 004 structured verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify-batch-004-structured.mjs'
      - 'data/research-batches/batch-004-registry-recheck.json'
      - '.github/workflows/batch-004-structured-verification.yml'

permissions:
  contents: write

concurrency:
  group: batch-004-structured-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run structured verification
        run: node scripts/verify-batch-004-structured.mjs
      - name: Safety assertions
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/research-batches/batch-004-structured-verification.json'));
          if(x.records.length!==21) throw Error('Expected 21 municipalities');
          if(x.safety.publicRulesCreated!==0||x.safety.negativeLegalConclusions!==0) throw Error('Safety invariant failed');
          if(x.records.some(r=>r.publicOutputCreated||r.negativeLegalConclusion)) throw Error('Unexpected public/legal output');
          console.log(x.summary);
          NODE
      - name: Commit structured verification results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research-batches/batch-004-structured-verification.json docs/research-batches/batch-004-structured-verification.md
          git diff --cached --quiet && exit 0
          git commit -m 'Add Batch 004 structured verification results'
          git push
