name: Batch 005 registry enrichment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-005-registry-enrichment.yml'
      - 'scripts/enrich-batch-005-municipal-discovery.mjs'
      - 'data/research-batches/batch-005-registry-discovery.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover relevant municipal pages from official registry websites
        run: node scripts/enrich-batch-005-municipal-discovery.mjs
      - name: Commit enrichment outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research-batches/batch-005-registry-enrichment.json \
                  docs/research-batches/batch-005-registry-enrichment.md \
                  data/research-status.json
          if git diff --cached --quiet; then
            echo 'No output changes to commit.'
            exit 0
          fi
          git commit -m 'Enrich batch 005 municipal discovery'
          git push origin HEAD:main
