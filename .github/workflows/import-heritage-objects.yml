name: Import nationwide heritage objects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import-rce-heritage-objects.mjs'
      - 'scripts/backfill-heritage-municipality-codes.mjs'
      - 'scripts/heritage-object-classifier.mjs'
      - 'scripts/verify-heritage-object-records.mjs'
      - 'scripts/verify-heritage-multi-address-regression.mjs'
      - 'scripts/build-heritage-municipality-shards.mjs'
      - 'data/heritage-object-types.json'
      - '.github/workflows/import-heritage-objects.yml'
  schedule:
    - cron: '23 4 3 * *'

permissions:
  contents: write

concurrency:
  group: heritage-object-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MDB reader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mdbtools

      - name: Download official nationwide RCE Monumentendatabank
        run: |
          mkdir -p .rce-extract/csv
          curl --fail --location --retry 4 --retry-all-errors --output .rce-extract/Extract_MRS.zip 'https://monumentenregister.cultureelerfgoed.nl/sites/default/files/MRS/Extract_MRS.zip'
          unzip -o .rce-extract/Extract_MRS.zip -d .rce-extract/raw
          MDB=$(find .rce-extract/raw -type f \( -iname '*.mdb' -o -iname '*.accdb' \) | head -1)
          test -n "$MDB" || { echo 'Official RCE archive contains no MDB/ACCDB'; find .rce-extract/raw -maxdepth 2 -type f; exit 1; }
          mdb-tables -1 "$MDB" > .rce-extract/tables.txt
          while IFS= read -r table; do
            test -n "$table" || continue
            safe=$(printf '%s' "$table" | tr '/\\ ' '___')
            mdb-export "$MDB" "$table" > ".rce-extract/csv/${safe}.csv" || true
          done < .rce-extract/tables.txt
          echo "RCE tables: $(wc -l < .rce-extract/tables.txt)"

      - name: Import all current RCE rijksmonument objects
        run: node scripts/import-rce-heritage-objects.mjs .rce-extract/csv

      - name: Backfill missing municipality codes from PDOK
        env:
          PDOK_BACKFILL_CONCURRENCY: '8'
          PDOK_BACKFILL_RETRIES: '3'
          PDOK_BACKFILL_TIMEOUT_MS: '12000'
        run: node scripts/backfill-heritage-municipality-codes.mjs

      - name: Validate imported object database
        run: node scripts/verify-heritage-object-records.mjs

      - name: Run multi-address and resolver regression
        run: node scripts/verify-heritage-multi-address-regression.mjs

      - name: Build municipality heritage shards
        run: node scripts/build-heritage-municipality-shards.mjs

      - name: Compress nationwide heritage database
        run: |
          gzip -9 -c data/heritage-object-records.json > data/heritage-object-records.json.gz
          test -s data/heritage-object-records.json.gz
          echo "Uncompressed bytes: $(wc -c < data/heritage-object-records.json)"
          echo "Compressed bytes: $(wc -c < data/heritage-object-records.json.gz)"
          test $(wc -c < data/heritage-object-records.json.gz) -lt 100000000

      - name: Commit refreshed object database
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/heritage-object-records.json.gz data/heritage-object-import-report.json data/heritage-municipalities
          if git diff --cached --quiet; then
            echo 'No heritage object changes'
          else
            git commit -m 'Refresh nationwide heritage object database'
            git checkout -- data/heritage-object-records.json
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
