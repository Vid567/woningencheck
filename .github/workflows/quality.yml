name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --check assets/app.js
      - name: Parse all production JSON and verify municipality dropdown data
        run: node scripts/verify-data.mjs
      - run: node scripts/verify-pipeline.mjs
      - run: node scripts/test-applicability.mjs
      - run: node scripts/test-geography.mjs
      - run: node scripts/test-batch-001.mjs
      - run: node scripts/test-batch-001-closure.mjs
      - run: node scripts/test-batch-002.mjs
      - run: node scripts/test-batch-002-closure.mjs
      - run: node scripts/test-batch-003.mjs
      - run: node scripts/test-batch-004-hybrid.mjs
      - run: node scripts/test-national-discovery.mjs
      - run: node scripts/verify-dynamic-parameters.mjs
      - name: Run automation selftest
        run: |
          node scripts/automation/selftest.mjs
      - name: Run authoritative accounting
        run: |
          node scripts/automation/accounting.mjs
      - name: Upload automation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automation-selftest-accounting-${{ github.run_number }}
          path: |
            reports/automation/
            artifacts/selftest/
          if-no-files-found: ignore
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install jsonschema openpyxl
      - run: python scripts/validate-schemas.py
      - run: python scripts/verify-workbook.py
      - name: Verify official sources
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: node scripts/verify-sources.mjs



