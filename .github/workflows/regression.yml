name: Woningencheck Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'data/**'
      - 'scripts/heritage/**'
      - 'tests/**'
      - '.github/workflows/regression.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'data/**'
      - 'scripts/heritage/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run decision-engine regression and 342-municipality data QA
        run: node tests/regression.mjs
      - name: Run heritage resolver regression
        run: node tests/heritage-regression.mjs
      - name: Run Amsterdam heritage adapter regression
        run: node tests/heritage-amsterdam.mjs
      - name: Run Utrecht heritage adapter regression
        run: node tests/heritage-utrecht.mjs
      - name: Run Eindhoven heritage adapter regression
        run: node tests/heritage-eindhoven.mjs
      - name: Run Arnhem heritage adapter regression
        run: node tests/heritage-arnhem.mjs
      - name: Run Enschede heritage adapter regression
        run: node tests/heritage-enschede.mjs
      - name: Run A-B heritage batch 1 regression
        run: node tests/heritage-batch-ab1.mjs
